spring:
  application:
    name: cross-check-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# The frontend uses durable asynchronous jobs by default.
crosscheck:
  analysis:
    jobs:
      enabled: ${ASYNC_ANALYSIS_ENABLED:true}
      database-path: ${ANALYSIS_DATABASE_PATH:data/cross-check}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /api/swagger-ui.html
    disable-swagger-default-url: true
    persist-authorization: false
  paths-to-match: /api/analysis/**
