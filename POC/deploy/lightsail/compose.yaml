name: crosscheck-beta
services:
  api:
    image: localhost/cross-check-api:${RELEASE_TAG:?Set RELEASE_TAG}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${ANALYSIS_PROFILE:-replay}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      API_DOCS_ENABLED: false
      CONVERSATION_TOKEN_SECRET: ${CONVERSATION_TOKEN_SECRET:?Set conversation secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_POLITICAL_ANALYSIS_AGENT_ID: ${OPENAI_POLITICAL_ANALYSIS_AGENT_ID:-}
      POLITICAL_AGENT_REVISION: ${POLITICAL_AGENT_REVISION:-political-v21}
      REPLAY_SCENARIO: ${REPLAY_SCENARIO:-PLUS_ULTRA_V20}
      ANALYSIS_DATABASE_PATH: /app/data/cross-check
      REPLAY_DATABASE_PATH: /app/data/replay
      CROSSCHECK_ANALYSIS_JOBS_CONCURRENCY: 1
      CROSSCHECK_ANALYSIS_JOBS_QUEUE_CAPACITY: 5
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m -XX:ActiveProcessorCount=2}
    volumes:
      - analysis-data:/app/data
    mem_limit: ${API_MEMORY_LIMIT:-480m}
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  web:
    image: localhost/cross-check-web:${RELEASE_TAG:?Set RELEASE_TAG}
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: ${WEB_MEMORY_LIMIT:-64m}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  edge:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact email}
      BETA_USERNAME: ${BETA_USERNAME:-beta}
      BETA_PASSWORD_HASH: ${BETA_PASSWORD_HASH:?Set bcrypt hash}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: ${EDGE_MEMORY_LIMIT:-96m}
    depends_on:
      web:
        condition: service_healthy
volumes:
  analysis-data:
    name: crosscheck-beta-analysis-data
  caddy-data:
    name: crosscheck-beta-caddy-data
  caddy-config:
    name: crosscheck-beta-caddy-config
