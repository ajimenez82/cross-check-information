worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    limit_req_zone $binary_remote_addr zone=analysis_requests:1m rate=2r/m;
    limit_req_status 429;
    map $http_x_forwarded_proto $public_scheme {
        default $scheme;
        https https;
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /api/analysis/jobs {
            limit_req zone=analysis_requests burst=3 nodelay;
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_read_timeout 120s;
        }
        location /api/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
